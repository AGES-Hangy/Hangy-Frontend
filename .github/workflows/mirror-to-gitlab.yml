name: Mirror to AGES GitLab

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push changed ref to GitLab
        env:
          GITLAB_USERNAME: ${{ vars.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPOSITORY: tools.ages.pucrs.br/2026-2/2jk-4jk/hangy/hangy-frontend.git
        shell: bash
        run: |
          set -euo pipefail

          : "${GITLAB_USERNAME:?Repository variable GITLAB_USERNAME is required}"
          : "${GITLAB_TOKEN:?Repository secret GITLAB_TOKEN is required}"

          gitlab_url="https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@${GITLAB_REPOSITORY}"

          push_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if git push "${gitlab_url}" "$@"; then
                return 0
              fi
              if (( attempt == 3 )); then
                echo "GitLab push failed after ${attempt} attempts" >&2
                return 1
              fi
              echo "GitLab push failed (attempt ${attempt}/3); retrying in 20 seconds" >&2
              sleep 20
            done
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            push_with_retry refs/remotes/origin/main:refs/heads/main
            push_with_retry refs/remotes/origin/develop:refs/heads/develop
            push_with_retry --tags
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            push_with_retry "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          else
            push_with_retry "refs/remotes/origin/${GITHUB_REF_NAME}:refs/heads/${GITHUB_REF_NAME}"
          fi
