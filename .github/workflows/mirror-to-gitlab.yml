name: Mirror to AGES GitLab

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to mirror
        required: true
        default: develop
        type: choice
        options:
          - develop
          - main

permissions:
  contents: read

concurrency:
  group: gitlab-mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push changed ref to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPOSITORY: tools.ages.pucrs.br/2026-2/2jk-4jk/hangy/hangy-frontend.git
          GITLAB_TARGET_BRANCH: ${{ inputs.target_branch }}
        shell: bash
        run: |
          set -euo pipefail

          : "${GITLAB_TOKEN:?Repository secret GITLAB_TOKEN is required}"

          git remote remove gitlab 2>/dev/null || true
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPOSITORY}"

          push_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              if git push gitlab "$@"; then
                return 0
              fi
              if (( attempt == 3 )); then
                echo "GitLab push failed after ${attempt} attempts" >&2
                return 1
              fi
              echo "GitLab push failed (attempt ${attempt}/3); retrying in 20 seconds" >&2
              sleep 20
            done
          }

          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            push_with_retry "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          else
            branch="${GITHUB_REF_NAME}"
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              branch="${GITLAB_TARGET_BRANCH}"
            fi

            git fetch origin "${branch}"
            git checkout -B "${branch}" "refs/remotes/origin/${branch}"
            push_with_retry "refs/heads/${branch}:refs/heads/${branch}"
          fi
