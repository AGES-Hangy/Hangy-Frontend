name: Mirror to AGES GitLab

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-mirror-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push main, develop and tags to GitLab
        env:
          GITLAB_USERNAME: ${{ vars.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPOSITORY: tools.ages.pucrs.br/2026-2/2jk-4jk/hangy/hangy-frontend.git
        shell: bash
        run: |
          set -euo pipefail

          : "${GITLAB_USERNAME:?Repository variable GITLAB_USERNAME is required}"
          : "${GITLAB_TOKEN:?Repository secret GITLAB_TOKEN is required}"

          gitlab_url="https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@${GITLAB_REPOSITORY}"

          git push "${gitlab_url}" --force \
            refs/remotes/origin/main:refs/heads/main \
            refs/remotes/origin/develop:refs/heads/develop
          git push "${gitlab_url}" --tags
